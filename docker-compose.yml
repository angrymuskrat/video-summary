services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: video_summary
      POSTGRES_USER: video_summary
      POSTGRES_PASSWORD: video_summary
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    gpus: all
    environment:
      VIDEO_SUMMARY_DATABASE_URL: postgresql+psycopg://video_summary:video_summary@db:5432/video_summary
      VIDEO_SUMMARY_STORAGE_ROOT: /app/data
      VIDEO_SUMMARY_ARTIFACT_RETENTION_HOURS: ${VIDEO_SUMMARY_ARTIFACT_RETENTION_HOURS:-168}
      VIDEO_SUMMARY_CLEANUP_INTERVAL_SECONDS: ${VIDEO_SUMMARY_CLEANUP_INTERVAL_SECONDS:-1800}
      VIDEO_SUMMARY_FRONTEND_ORIGIN: http://localhost:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-local-vllm}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://vllm:8000/v1}
      OPENAI_TIMEOUT_SEC: ${OPENAI_TIMEOUT_SEC:-60}
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - app-data:/app/data
    depends_on:
      - db

  vllm:
    image: vllm/vllm-openai:latest
    profiles:
      - llm
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${VLLM_CACHE_DIR:-./docker/models/huggingface}:/root/.cache/huggingface
    ports:
      - "${VLLM_HOST_PORT:-8000}:8000"
    ipc: host
    gpus: all
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      - --api-key
      - ${VLLM_API_KEY:-local-vllm}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-16384}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.92}
      - --quantization
      - ${VLLM_QUANTIZATION:-awq}

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres-data:
  app-data:
